name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (no leading v) — must match package.json'
        required: true
      ref:
        description: 'Branch or commit to release from'
        required: false
        default: 'main'

permissions:
  contents: write
  actions: read # needed to look up the test workflow run for this commit

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Verify package.json version matches input
        run: |
          FILE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$FILE_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::package.json version ($FILE_VERSION) does not match requested version (${{ github.event.inputs.version }})"
            exit 1
          fi

      - name: Ensure no release already exists for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub release already exists for $TAG"
            exit 1
          fi

      - name: Verify CI succeeded for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "Commit: $SHA"
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${SHA}&status=completed&per_page=1" --jq '.workflow_runs[0].conclusion // "none"')
          echo "test.yml conclusion for this commit: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::test.yml has not completed successfully for commit $SHA (conclusion: $CONCLUSION). Refusing to release."
            exit 1
          fi

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          START=$(grep -n "^## \[$VERSION\]" CHANGELOG.md | head -1 | cut -d: -f1)
          if [ -z "$START" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          REST=$(tail -n +$((START+1)) CHANGELOG.md)
          END=$(printf '%s\n' "$REST" | grep -n "^## \[" | head -1 | cut -d: -f1)
          if [ -z "$END" ]; then
            NOTES="$REST"
          else
            NOTES=$(printf '%s\n' "$REST" | head -n $((END-1)))
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::No CHANGELOG.md entry found for version $VERSION"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent: delete any pre-existing tag first (e.g. left
          # over from a previous run that tagged successfully but
          # failed a later step -- the "no release exists yet" check
          # above is what actually guards against re-releasing).
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag -f -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Routed through an env var rather than interpolated straight
          # into the script below -- CHANGELOG.md entries routinely
          # contain backticks (code spans), and inlining them directly
          # via ${{ }} pastes that text into the literal bash script,
          # where bash reads backticks as command substitution. An env
          # var's value isn't re-parsed that way when expanded as "$NOTES".
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "v${{ github.event.inputs.version }}" \
            --title "v${{ github.event.inputs.version }}" \
            --notes "$NOTES"
